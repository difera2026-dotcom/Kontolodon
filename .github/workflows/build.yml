name: Build ScrollTranslate Legacy APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for f in *.zip; do
            unzip -o "$f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p scrolltranslate-legacy-xposed assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScrollTranslate-Legacy-API82-APK
          path: scrolltranslate-legacy-xposed/app/build/outputs/apk/release/*.apk
